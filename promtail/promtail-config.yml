# =============================================================================
# Cấu hình Promtail Log Collector (Bước 5 - Commit 3)
# Đề tài: Triển khai và quản trị hệ thống Blog / CMS
# Sinh viên: Nguyễn Ngọc Chi - MSSV: DTC245200392
# =============================================================================

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Thu thập log từ toàn bộ Docker Containers trên máy chủ
  - job_name: docker
    static_configs:
      - targets:
          - localhost
        labels:
          job: docker
          __path__: /var/lib/docker/containers/*/*-json.log
    pipeline_stages:
      - json:
          expressions:
            output: log
            stream: stream
            attrs: attrs
            tag: attrs.tag
            time: time
      - timestamp:
          source: time
          format: RFC3339Nano
      - regex:
          expression: '^/var/lib/docker/containers/(?P<container_id>[a-f0-9]+)/.*'
          source: filename
      - labels:
          stream:
          container_id:

  # Thu thập log Nginx (Access log và Error log) phục vụ truy vấn HTTP 4xx/5xx
  - job_name: nginx
    static_configs:
      - targets:
          - localhost
        labels:
          job: nginx
          __path__: /var/log/nginx/*log

  # Thu thập log của ứng dụng web và cơ sở dữ liệu
  - job_name: webapp
    static_configs:
      - targets:
          - localhost
        labels:
          job: webapp
          __path__: /var/log/wordpress/*log

  # Thu thập log hệ thống chung
  - job_name: system
    static_configs:
      - targets:
          - localhost
        labels:
          job: varlogs
          __path__: /var/log/*log
