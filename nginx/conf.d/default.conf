# =============================================================================
# Cấu hình Nginx Reverse Proxy và Bảo mật SSL/TLS (Bước 3 - Commit 1)
# Đề tài: Triển khai và quản trị hệ thống Blog / CMS
# Sinh viên: Nguyễn Ngọc Chi - MSSV: DTC245200392
# =============================================================================

# Chuyển hướng toàn bộ lưu lượng HTTP (Cổng 80) sang HTTPS (Cổng 443)
server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    # Security header cơ bản trên kênh HTTP
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        return 301 https://$host$request_uri;
    }
}

# Máy chủ ảo HTTPS bảo mật (Cổng 443)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name localhost;

    # Cấu hình chứng chỉ SSL/TLS tự ký
    ssl_certificate     /etc/nginx/ssl/nginx.crt;
    ssl_certificate_key /etc/nginx/ssl/nginx.key;

    # Giao thức bảo mật TLS khuyến nghị
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Cấu hình Security Headers theo đúng tiêu chí Báo cáo
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Giới hạn dung lượng tải lên (Upload size cho CMS)
    client_max_body_size 64M;

    # Chặn truy cập trực tiếp các tệp tin nhạy cảm (.env, .git, .htaccess,...)
    location ~ /\.(ht|git|env|svn) {
        deny all;
        return 404;
    }

    # Chặn thực thi mã PHP trong thư mục uploads của WordPress
    location ~* /(?:uploads|files)/.*\.php$ {
        deny all;
    }

    # Reverse Proxy chuyển tiếp request vào container WordPress
    location / {
        proxy_pass http://wordpress:80;

        # Cấu hình proxy headers chuẩn xác
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Thiết lập timeout hợp lý
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    # Định tuyến quản trị phpMyAdmin qua Reverse Proxy
    location /phpmyadmin/ {
        proxy_pass http://phpmyadmin:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
